[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation"
version = "0.1.0-phase1"
description = "Android UI automation framework (Python + OpenCV + ADB) — Phase 1 foundation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "emre dogan", email = "emre30283@gmail.com" }]

# Runtime dependencies. Locked exactly in requirements-lock.txt.
# Lower bounds align with what Phase 0 measured; upper bounds keep us
# inside the major version known to work.
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]

[project.scripts]
automation-bootstrap = "automation.bootstrap:main"

[tool.setuptools.packages.find]
include = ["automation*"]
exclude = ["bench*", "tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
